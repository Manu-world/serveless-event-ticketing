name: Serverless API CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pytest.ini'
      - '.github/workflows/**'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: event-ticketing
  PYTHONPATH: .

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest boto3

      - name: Run Unit Tests
        run: pytest tests/ -q

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::272558305025:role/${{ env.PROJECT_NAME }}-github-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Package and Deploy Lambda Updates
        run: |
          set -euo pipefail
          mkdir -p dist
          for function in register get_events get_registrations delete_registration; do
            zip -j "dist/${function}.zip" "src/${function}.py"
            aws lambda update-function-code \
              --function-name "${PROJECT_NAME}-${function}" \
              --zip-file "fileb://dist/${function}.zip" \
              --publish
          done
