name: Serverless API CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/**'

# Required permissions for OIDC authentication
permissions:
  id-token: write
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest boto3

      - name: Run Unit Tests
        run: pytest tests/

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::272558305025:role/azubi-event-ticketing-github-oidc-role
          aws-region: us-east-1

      - name: Package and Deploy Lambda Updates
        run: |
          mkdir -p dist
          for function in register get_events get_registrations delete_registration; do
            zip -j dist/${function}.zip src/${function}.py
            aws lambda update-function-code \
              --function-name azubi-event-ticketing-${function} \
              --zip-file fileb://dist/${function}.zip \
              --publish
          done
